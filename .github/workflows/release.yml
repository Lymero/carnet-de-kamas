name: Release

# Pushing a version tag (v3.0.0) builds the desktop installers for Windows, macOS and
# Linux and publishes them as a GitHub release. The tag must match package.json's
# version, and CHANGELOG.md must have a section for it.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci

      - name: Check the tag matches package.json and CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          grep -q "^## $VERSION " CHANGELOG.md

      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:e2e

      - name: Create the draft release, with that version's CHANGELOG section as notes
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "**Installation :** télécharge l'installateur de ton système ci-dessous (Windows : \`…-setup.exe\`, macOS : \`.dmg\`, Linux : \`.AppImage\` ou \`.deb\`), puis lance-le. Aucun autre logiciel n'est nécessaire."
            echo
            awk -v v="$VERSION" '$0 ~ "^## " v " " {found=1; next} /^## / {found=0} found' CHANGELOG.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "Carnet de Kamas $VERSION" --notes-file notes.md
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: --target universal-apple-darwin
          # The oldest supported Ubuntu, so the Linux builds run on as many distributions as possible.
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Add both macOS architectures (universal app)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.verify.outputs.release-id }}
          args: ${{ matrix.args }}

  publish:
    # Only once every installer is uploaded, so nobody sees a half-filled release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
