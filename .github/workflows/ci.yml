name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners (see playwright.config.js).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  desktop:
    # The Tauri app: Rust format, lint and tests, then the real app built and driven
    # through WebView2 (Windows only, see tests/desktop/).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Keep the compiled crates even when a later step fails, so a fix is quick to check.
          cache-on-failure: true
      - run: npm ci
      - run: npm run check:rust
      - run: npx tauri build --no-bundle
      - name: Show the WebView2 runtime the app runs on
        shell: pwsh
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$id"
          $versions = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv }
          if ($versions) { "WebView2 runtime: $versions" } else { "WebView2 runtime: not installed" }
      - run: npm run test:desktop
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
