name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners (see playwright.config.js).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  desktop:
    # The Tauri app: Rust format, lint and tests, then a build of the app. The tests of the
    # real app (npm run test:desktop) run locally before each release: on GitHub's runners,
    # WebView2 ignores the DevTools arguments they rely on (the runner's WebView2 starts with
    # Tauri's default arguments only, whether they come from the environment or the registry).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Keep the compiled crates even when a later step fails, so a fix is quick to check.
          cache-on-failure: true
      - run: npm ci
      - run: npm run check:rust
      - run: npx tauri build --no-bundle
